# 14-class SemanticKITTI middle ground between the D3CTTA 7-class map and our
# 17-class default. Keeps more semantic detail than 7 ("more impressive") while
# merging the tiny fragile thing classes (bicycle, truck, bus, motorcycle ->
# other-vehicle) and splitting the 7 superclasses where the detail is real:
#   vehicle -> car / other-vehicle, road -> road / parking,
#   manmade -> building / fence / pole / traffic-sign, vegetation -> vegetation / trunk.
# Classes: 0 background, 1-14 evaluated (14-class paradigm).
name: "kitti14"
labels:
  0: "unlabeled"
  1: "outlier"
  10: "car"
  11: "bicycle"
